name: CI

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Run tests
        run: go test -v ./...

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Auto-format
        run: gofmt -w .

      - name: Commit linted files
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: fix code style"
          commit_options: "--no-verify"

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Run go vet
        run: go vet ./...

  vscode:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pkg/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: pkg/vscode

      - name: Check extension
        run: npm run check
        working-directory: pkg/vscode

  intellij:
    name: IntelliJ Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pkg/*/package-lock.json

      - name: Install VS Code webview dependencies
        run: npm ci
        working-directory: pkg/vscode

      - name: Install IntelliJ webview dependencies
        run: npm ci
        working-directory: pkg/intellij

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-intellij-${{ hashFiles('pkg/intellij/**/*.gradle.kts', 'pkg/intellij/gradle.properties', 'pkg/intellij/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-intellij-

      - name: Test and build plugin
        run: ./gradlew verifyPluginProjectConfiguration test buildPlugin --console=plain
        working-directory: pkg/intellij

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: pegg-intellij
          path: pkg/intellij/build/distributions/*.zip
          if-no-files-found: error
