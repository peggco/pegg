name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Sync package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --prefix ./npm
      - name: Publish to npm
        run: npm publish ./npm --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-vscode:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pkg/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm ci
        working-directory: pkg/vscode
      - name: Verify extension
        run: npm run check
        working-directory: pkg/vscode
      - name: Sync extension version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        working-directory: pkg/vscode
      - name: Package VSIX
        run: npx @vscode/vsce package --out "pegg-vscode-${GITHUB_REF_NAME#v}.vsix"
        working-directory: pkg/vscode
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: pegg-vscode
          path: pkg/vscode/*.vsix
      - name: Attach VSIX to GitHub release
        run: gh release upload "$GITHUB_REF_NAME" pkg/vscode/*.vsix --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to VS Code Marketplace
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish --packagePath pkg/vscode/*.vsix
          else
            echo "VSCE_PAT is not set; skipping Marketplace publish."
          fi
        working-directory: pkg/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish pkg/vscode/*.vsix
          else
            echo "OVSX_PAT is not set; skipping Open VSX publish."
          fi
        working-directory: pkg/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
