name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Validate release version
        run: python3 scripts/release/set_version.py "${GITHUB_REF_NAME#v}" --check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        run: npm publish ./npm --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-vscode:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pkg/*/package-lock.json
      - name: Install shared chat UI dependencies
        run: npm ci
        working-directory: pkg/chat-ui
      - name: Install extension dependencies
        run: npm ci
        working-directory: pkg/vscode
      - name: Verify extension
        run: npm run check
        working-directory: pkg/vscode
      - name: Package VSIX
        run: npx @vscode/vsce package --out "pegg-vscode-${GITHUB_REF_NAME#v}.vsix"
        working-directory: pkg/vscode
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: pegg-vscode
          path: pkg/vscode/*.vsix
      - name: Attach VSIX to GitHub release
        run: gh release upload "$GITHUB_REF_NAME" pkg/vscode/*.vsix --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to VS Code Marketplace
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish --packagePath "pegg-vscode-${GITHUB_REF_NAME#v}.vsix"
          else
            echo "VSCE_PAT is not set; skipping Marketplace publish."
          fi
        working-directory: pkg/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish "pegg-vscode-${GITHUB_REF_NAME#v}.vsix"
          else
            echo "OVSX_PAT is not set; skipping Open VSX publish."
          fi
        working-directory: pkg/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  release-intellij:
    needs: release
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pkg/*/package-lock.json
      - name: Install shared chat UI dependencies
        run: npm ci
        working-directory: pkg/chat-ui
      - name: Install IntelliJ webview dependencies
        run: npm ci
        working-directory: pkg/intellij
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-intellij-release-${{ hashFiles('pkg/intellij/**/*.gradle.kts', 'pkg/intellij/gradle.properties', 'pkg/intellij/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-intellij-release-
      - name: Build plugin
        run: ./gradlew clean verifyPluginProjectConfiguration test buildPlugin --console=plain
        working-directory: pkg/intellij
      - name: Sign plugin
        run: |
          if [ -n "${CERTIFICATE_CHAIN:-}" ] && [ -n "${PRIVATE_KEY:-}" ]; then
            ./gradlew signPlugin --console=plain
          else
            echo "JetBrains signing secrets are not set; skipping signPlugin."
          fi
        working-directory: pkg/intellij
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: pegg-intellij
          path: pkg/intellij/build/distributions/*.zip
          if-no-files-found: error
      - name: Attach plugin to GitHub release
        run: gh release upload "$GITHUB_REF_NAME" pkg/intellij/build/distributions/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to JetBrains Marketplace
        run: |
          if [ -n "${PUBLISH_TOKEN:-}" ] && [ -n "${CERTIFICATE_CHAIN:-}" ] && [ -n "${PRIVATE_KEY:-}" ]; then
            ./gradlew publishPlugin --console=plain
          else
            echo "JetBrains Marketplace secrets are incomplete; skipping publish."
          fi
        working-directory: pkg/intellij

  release-desktop:
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/arm64
            slug: darwin-arm64
            tags: gui
          - os: macos-13
            platform: darwin/amd64
            slug: darwin-amd64
            tags: gui
          - os: windows-2022
            platform: windows/amd64
            slug: windows-amd64
            tags: gui
          - os: windows-11-arm
            platform: windows/arm64
            slug: windows-arm64
            tags: gui
          - os: ubuntu-22.04
            platform: linux/amd64
            slug: linux-amd64
            tags: gui webkit2_41
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pkg/desktop/frontend/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: pkg/desktop/frontend
      - name: Build desktop app
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd pkg/desktop
          wails build -clean -tags "${{ matrix.tags }}" -platform "${{ matrix.platform }}" \
            -ldflags "-s -w -X github.com/peggco/pegg/internal/core/config.AppVersion=${VERSION#v}"
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p pkg/desktop/dist
          arch="$(echo '${{ matrix.platform }}' | cut -d/ -f2)"
          ditto -c -k --sequesterRsrc --keepParent "pkg/desktop/build/bin/pegg-desktop.app" \
            "pkg/desktop/dist/pegg-desktop_${VERSION#v}_darwin_${arch}.zip"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path pkg/desktop/dist | Out-Null
          $arch = "${{ matrix.platform }}".Split('/')[1]
          Compress-Archive -Path "pkg/desktop/build/bin/pegg-desktop.exe" `
            -DestinationPath "pkg/desktop/dist/pegg-desktop_$($env:VERSION.Substring(1))_windows_${arch}.zip"
      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/release/package_desktop_linux.sh "${VERSION#v}" amd64 pkg/desktop/dist
      - name: Attach desktop artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" pkg/desktop/dist/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: pegg-desktop-${{ matrix.slug }}
          path: pkg/desktop/dist/*

  publish-homebrew:
    needs: release-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pegg-desktop-darwin-*
          path: dist
          merge-multiple: true
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew publish."
            exit 0
          fi
          version="${VERSION#v}"
          sha_arm="$(sha256sum "dist/pegg-desktop_${version}_darwin_arm64.zip" | cut -d' ' -f1)"
          sha_intel="$(sha256sum "dist/pegg-desktop_${version}_darwin_amd64.zip" | cut -d' ' -f1)"
          sed -e "s|@VERSION@|${version}|g" -e "s|@SHA_ARM@|${sha_arm}|g" -e "s|@SHA_INTEL@|${sha_intel}|g" \
            packaging/homebrew/pegg-desktop.rb.tmpl > /tmp/pegg-desktop.rb
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/peggco/homebrew-tap.git" tap || {
            echo "homebrew-tap repository is unavailable; skipping."
            exit 0
          }
          mkdir -p tap/Casks
          cp /tmp/pegg-desktop.rb tap/Casks/pegg-desktop.rb
          cd tap
          git config user.name "pegg-release-bot"
          git config user.email "info@pegg.dev"
          git add Casks/pegg-desktop.rb
          git commit -m "pegg-desktop ${version}" || exit 0
          git push

  publish-aur:
    needs: release-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pegg-desktop-linux-amd64
          path: dist
          merge-multiple: true
      - name: Prepare AUR package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          sha="$(sha256sum "dist/pegg-desktop_${version}_linux_amd64.tar.gz" | cut -d' ' -f1)"
          mkdir -p /tmp/aur
          sed -e "s|^pkgver=.*|pkgver=${version}|" \
              -e "s|^sha256sums_x86_64=.*|sha256sums_x86_64=('${sha}')|" \
              packaging/aur/PKGBUILD > /tmp/aur/PKGBUILD
      - name: Publish to AUR
        if: ${{ env.AUR_SSH_PRIVATE_KEY != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: pegg-desktop
          pkgbuild: /tmp/aur/PKGBUILD
          commit_username: pegg-release-bot
          commit_email: info@pegg.dev
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "pegg-desktop ${{ github.ref_name }}"
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  publish-linux-repo:
    needs: release-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pegg-desktop-linux-amd64
          path: dist
          merge-multiple: true
      - name: Publish deb/rpm to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          if [ -z "${CLOUDSMITH_API_KEY:-}" ]; then
            echo "CLOUDSMITH_API_KEY is not set; skipping apt/rpm publish."
            exit 0
          fi
          pip install --quiet cloudsmith-cli
          cloudsmith push deb peggco/pegg any-distro/any-version dist/*.deb
          cloudsmith push rpm peggco/pegg any-distro/any-version dist/*.rpm
