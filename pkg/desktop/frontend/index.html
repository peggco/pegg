<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Pegg</title>
    <script>
      (() => {
        try {
          const raw = localStorage.getItem('pegg.theme');
          if (raw) {
            const parsed = JSON.parse(raw);
            const bg = parsed && parsed.tokens && parsed.tokens['--pg-bg'];
            document.documentElement.style.background = bg || '#18181b';
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
